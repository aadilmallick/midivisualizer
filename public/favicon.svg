<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#0f172a"/>

  <!-- Piano keys group -->
  <g transform="translate(20, 45)">
    <!-- White keys -->
    <rect x="0" y="0" width="16" height="48" rx="2" fill="#f8fafc"/>
    <rect x="18" y="0" width="16" height="48" rx="2" fill="#f8fafc"/>
    <rect x="36" y="0" width="16" height="48" rx="2" fill="#60a5fa"/>
    <rect x="54" y="0" width="16" height="48" rx="2" fill="#f8fafc"/>
    <rect x="72" y="0" width="16" height="48" rx="2" fill="#f8fafc"/>

    <!-- Black keys -->
    <rect x="12" y="0" width="10" height="30" rx="1" fill="#1e293b"/>
    <rect x="30" y="0" width="10" height="30" rx="1" fill="#1e293b"/>
    <rect x="60" y="0" width="10" height="30" rx="1" fill="#1e293b"/>
  </g>

  <!-- Flowing notes above -->
  <g opacity="0.8">
    <!-- Note 1 -->
    <rect x="48" y="18" width="10" height="16" rx="2" fill="#3b82f6"/>
    <rect x="50" y="16" width="6" height="2" rx="1" fill="#60a5fa"/>

    <!-- Note 2 -->
    <rect x="68" y="22" width="10" height="14" rx="2" fill="#2563eb"/>
    <rect x="70" y="20" width="6" height="2" rx="1" fill="#60a5fa"/>

    <!-- Note 3 -->
    <rect x="38" y="26" width="10" height="12" rx="2" fill="#3b82f6"/>
    <rect x="40" y="24" width="6" height="2" rx="1" fill="#60a5fa"/>
  </g>

  <!-- Accent line -->
  <line x1="20" y1="93" x2="108" y2="93" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
</svg>
